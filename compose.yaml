# hevy-garmin-sync under Docker Compose. Copy .env.example to .env, fill it in,
# then: docker compose up -d
services:
  hevy-garmin-sync:
    # Releases are tagged with their version only; there is no `latest`.
    # https://github.com/zimmertr/hevy-garmin-sync/releases has the newest.
    image: zimmertr/hevy-garmin-sync:0.2.0
    restart: unless-stopped
    env_file: .env
    # One copy only: two would refresh the same rotating Garmin token and
    # lock each other out.
    volumes:
      # The rotated sign-in tokens. Keep it across restarts.
      - data:/data

volumes:
  data:
