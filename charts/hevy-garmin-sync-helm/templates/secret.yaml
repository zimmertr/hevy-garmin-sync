{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hgs.secret" . }}
  labels:
    {{- include "hgs.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secret }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
