apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  # Stated, not left to the installer: kustomize 5.8 no longer adds a namespace to
  # a chart's resources, and Argo CD refuses one without (seen 2026-11-10).
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hgs.labels" . | nindent 4 }}
spec:
  # Exactly one copy, never two at once: two would refresh the same rotating
  # Garmin token and lock each other out (spec D-4, A-7).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hgs.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hgs.selector" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: hevy-garmin-sync
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "hgs.secret" . }}
          env:
            - name: DATA_DIR
              value: /data
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "hgs.claim" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
