name: Scheduled Image Scan

# The release scan gates what ships, but CVEs are published after an image
# ships. This re-scans the latest released image every week, sends the findings
# to the Security tab, and fails (and GitHub emails) only on a fixable Critical
# or High. yggdrasil's image-scan module. It fails until the first release
# exists.
on:
  schedule:
    - cron: '23 14 * * 1' # Mondays 14:23 UTC, off the top of the hour, when GitHub sheds cron load
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    name: Scheduled Image Scan
    uses: zimmertr/yggdrasil/.github/workflows/image-scan.yml@fd0ee632ebad3cb4623bd64ca77838e6aa7a2dce # v1.2.4
    permissions:
      contents: read
      security-events: write # the SARIF upload
    with:
      # The category keeps the Security tab's alert history.
      images: '[{"image": "ghcr.io/zimmertr/hevy-garmin-sync", "category": "trivy-released-image"}]'
