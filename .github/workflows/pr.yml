name: PR Checks

# What a PR must pass besides `test` (test.yml) and `PR Title` (pr-title.yml):
# ruff and mypy, the chart linted and rendered, and the image it would ship,
# built, linted, scanned and run. Decision record 0002.
#
# Required checks are these jobs' names (`Docker Build / Docker Build` is this
# job's name, then the module's); renaming one strands PRs on a check that
# never reports.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      # Pinned in requirements-dev.in with hashes, the same versions the
      # Makefile's `lint` and `typecheck` targets run.
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: mypy

  # yggdrasil's chart module: `helm lint`, a render with the defaults, then
  # the helm-unittest suites in the chart's tests/ folder (its records 0012
  # and 0060).
  chart:
    name: Chart
    uses: zimmertr/yggdrasil/.github/workflows/chart.yml@4ec50ebf1836d958627a22385be9585ca13bb627 # feat/standard-test-tools
    permissions:
      contents: read
    with:
      chart: charts/hevy-garmin-sync-helm

  # yggdrasil's docker-build module: hadolint, the linux/amd64 image built but
  # not pushed, a Trivy table in a sticky comment, tests/structure-test.yaml, then a
  # failure on any fixable Critical or High, as the release would refuse.
  docker-build:
    name: Docker Build
    uses: zimmertr/yggdrasil/.github/workflows/docker-build.yml@4ec50ebf1836d958627a22385be9585ca13bb627 # feat/standard-test-tools
    permissions:
      contents: read
      pull-requests: write # the sticky scan comment
    with:
      # As the release passes it: the apt upgrade layer reruns per push.
      build-args: APP_COMMIT=${{ github.event.pull_request.head.sha }}
      # What only the built image shows, as container-structure-test checks.
      structure-test: tests/structure-test.yaml
