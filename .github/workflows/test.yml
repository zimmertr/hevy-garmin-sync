name: test

# Every PR, and every release before it builds anything: release.yml calls this
# so the squash commit is tested as merged, not only the branch that became it.
on:
  pull_request:
  workflow_call:

# Its own group, since the caller's `release` group would deadlock a called
# workflow. A PR run is replaced by a newer push; a release run never is.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: PYTHONPATH=src python -m coverage run -m unittest discover -s tests -v
      # Line and branch coverage with no floor: the aim is 100%, and a gap gets
      # a test or a written reason (spec D-10). The table also goes to the
      # run's summary, so a gap shows on the PR.
      - run: |
          python -m coverage report
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
