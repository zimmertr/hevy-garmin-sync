name: PR Preview

# Each PR's preview image, from yggdrasil's pr-preview module: pushed to
# ghcr.io/zimmertr/hevy-garmin-sync-pr as pr-<N>-<head sha>, where the Argo CD
# pull request generator in Kubernetes-Manifests misc/hevy-garmin-sync-pr/
# finds it. TJ's own PRs get the `create pr container` label, which starts the
# preview, and a comment with its address (spec W-10, issue #62).
#
# `pull_request`, never `pull_request_target`: a fork's run gets no write token
# and no secret (yggdrasil record 0010).
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  preview:
    name: PR Preview
    uses: zimmertr/yggdrasil/.github/workflows/pr-preview.yml@6340018984af32ad2ee81931d636645f5b0f346c # feat/pr-preview-module
    permissions:
      contents: read
      packages: write # the preview image
      pull-requests: write # the label and the comment
    with:
      image: ghcr.io/zimmertr/hevy-garmin-sync-pr
      url: http://pr-${{ github.event.pull_request.number }}.atlas.sol.milkyway
      title: hevy-garmin-sync preview
