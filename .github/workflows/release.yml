name: release

# Every merge to main is a release. In order: the squash commit is tested as
# merged; yggdrasil's release module reads the version from its title
# (GitVersion), builds and pushes the image for amd64 and arm64, scans each
# platform, then tags and releases; pushes the chart under the same version;
# and only then points Kubernetes-Manifests at it. Decision records 0002,
# 0005, 0006 and 0012.
on:
  push:
    branches: [main]

# One release at a time, so two quick merges cannot race for a version or on
# the bump branch. cancel-in-progress stays false so every merge still
# releases, in order.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    # actionlint (required too) rejects the `$/` form zizmor prefers.
    uses: ./.github/workflows/test.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  release:
    name: Release
    needs: test
    uses: zimmertr/yggdrasil/.github/workflows/release.yml@fd0ee632ebad3cb4623bd64ca77838e6aa7a2dce # v1.2.4
    permissions:
      contents: write # the tag and release
      packages: write # the image and the chart, pushed to ghcr.io/zimmertr
    with:
      # Both platforms: users run it on amd64 and arm64 machines (spec D-3).
      images: '[{"image": "zimmertr/hevy-garmin-sync", "platforms": "linux/amd64,linux/arm64"}]'
      # The chart's name is not the image's: both live under ghcr.io/zimmertr,
      # and the chart name is its OCI path (bluebird#111). With the image, the
      # module sets the chart's appVersion to the release and writes the
      # image's digest into its values, since a GHCR tag can be moved
      # (record 0006).
      charts: >-
        [{"chart": "charts/hevy-garmin-sync-helm",
          "image": "ghcr.io/zimmertr/hevy-garmin-sync",
          "digest-set": ".image.digest"}]
      # Kubernetes-Manifests forbids direct commits to main, so the module
      # opens a self-merging PR on a fixed branch. The folder is live, so that
      # PR is a deploy: Argo CD rolls the pod (record 0005).
      deploys: >-
        [{"repo": "zimmertr/Kubernetes-Manifests",
          "file": "misc/hevy-garmin-sync/kustomization.yml",
          "set": "(.helmCharts[] | select(.name == \"hevy-garmin-sync-helm\")).version",
          "branch": "chore/hevy-garmin-sync-chart",
          "title": "chore(hevy-garmin-sync): bump chart"}]
    secrets:
      # Contents and pull-requests write on Kubernetes-Manifests.
      deploy-token: ${{ secrets.GH_PAT }}
