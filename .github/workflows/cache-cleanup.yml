name: Cache Cleanup

# yggdrasil's cache-cleanup module: deletes a closed PR's Actions caches, such
# as the docker-build layer cache, so they don't crowd main's out of the
# repo's 10 GB budget.
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cache-cleanup:
    name: Cache Cleanup
    uses: zimmertr/yggdrasil/.github/workflows/cache-cleanup.yml@2581d736b8cbff87c94c055f985062a73cffdccb # v3.1.3
    permissions:
      actions: write # gh cache delete
