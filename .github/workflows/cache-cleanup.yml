name: Cache Cleanup

# yggdrasil's cache-cleanup module: deletes a closed PR's Actions caches, such
# as the docker-build layer cache, so they don't crowd main's out of the
# repo's 10 GB budget.
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cache-cleanup:
    name: Cache Cleanup
    uses: zimmertr/yggdrasil/.github/workflows/cache-cleanup.yml@09f6b632a2fb0f0692df46b92cb04cc664a833a1 # v3.1.4
    permissions:
      actions: write # gh cache delete
