name: Cache Cleanup

# yggdrasil's cache-cleanup module: deletes a closed PR's Actions caches, such
# as the docker-build layer cache, so they don't crowd main's out of the
# repo's 10 GB budget.
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cache-cleanup:
    name: Cache Cleanup
    uses: zimmertr/yggdrasil/.github/workflows/cache-cleanup.yml@47059cdc3da02c837181fbb16cd5d8647dd968d8 # v3.1.5
    permissions:
      actions: write # gh cache delete
