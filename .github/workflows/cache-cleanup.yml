name: Cache Cleanup

# yggdrasil's cache-cleanup module: deletes a closed PR's Actions caches, such
# as the docker-build layer cache, so they don't crowd main's out of the
# repo's 10 GB budget.
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cache-cleanup:
    name: Cache Cleanup
    uses: zimmertr/yggdrasil/.github/workflows/cache-cleanup.yml@1662d921a9f6d3d0ac42d5777bb148f533b0fd5e # v3.1.6
    permissions:
      actions: write # gh cache delete
