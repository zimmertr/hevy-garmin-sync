version: 2
# hevy-trainer-sync's set, for this repo's three ecosystems. Every title is
# `build(deps): ...` or `build(deps-dev): ...`, which the PR Title check and
# GitVersion read as a patch. Patch and minor version updates merge themselves
# (dependabot-auto-merge.yml); everything else waits for TJ.
updates:
  # requirements.in and requirements-dev.in, whose hashed locks Dependabot
  # recompiles with pip-compile. Seven days after a release before proposing
  # it: a patch or minor merges itself and every merge releases. Security
  # updates don't wait; GitHub documents cooldown as version updates only.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

  # Every action is pinned to a commit SHA with its version in a comment.
  # Dependabot reads the comment and rewrites the SHA and the comment together.
  # Daily, with each release three days old before it is proposed: yggdrasil's
  # modules are pinned here too, and every yggdrasil release bakes three days
  # before its consumers take it (yggdrasil record 0023).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope

  # The base image, pinned as tag@digest. An upstream rebuild under the same
  # tag arrives as a digest PR, which is also the usual remedy when the weekly
  # image scan finds a fixable Critical or High.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
